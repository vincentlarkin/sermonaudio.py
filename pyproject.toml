[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sermonaudio.py"
dynamic = ["version"]
description = "Search and download sermons, speakers, series and whole churches from SermonAudio.com"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Vincent Larkin" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.25", "mutagen>=1.45"]
keywords = ["sermonaudio", "sermons", "downloader", "podcast", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
sapy = "sapy.cli:main"

[project.urls]
Homepage = "https://github.com/vincentlarkin/sermonaudio.py"

[tool.setuptools]
packages = ["sapy"]

[tool.setuptools.dynamic]
version = { attr = "sapy.__version__" }
